services:
  hbbs:
    container_name: rustdesk-hbbs
    image: ${RUSTDESK_IMAGE:-rustdesk/rustdesk-server:latest}
    command: hbbs
    environment:
      - ENCRYPTED_ONLY=1
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - ./data:/root
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: rustdesk-hbbr
    image: ${RUSTDESK_IMAGE:-rustdesk/rustdesk-server:latest}
    command: hbbr
    ports:
      - "21117:21117"
      - "21119:21119"
    volumes:
      - ./data:/root
    restart: unless-stopped
